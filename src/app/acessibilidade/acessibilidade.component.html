<button
  class="botao"
  type="button"
  aria-label="Abrir opções de acessibilidade"
  [attr.aria-expanded]="aberto()"
  (click)="aberto.set(true)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="4.5" r="1.8"/>
    <path d="M4.5 8.5l7.5 1.5 7.5-1.5M12 10v5M12 15l-3.5 6M12 15l3.5 6"/>
  </svg>
</button>

@if (aberto()) {

  <div class="fundo" (click)="fechar()"></div>

  <aside class="painel" role="dialog" aria-modal="true" aria-labelledby="titulo-acessibilidade">

    <header>
      <h2 id="titulo-acessibilidade">Acessibilidade</h2>
      <button class="fechar" type="button" aria-label="Fechar" (click)="fechar()">✕</button>
    </header>

    <section>
      <h3>Tamanho da letra</h3>

      <div class="fonte">
        <button type="button" aria-label="Diminuir letra"
          [disabled]="porcentagem() <= minima * 100" (click)="mudarFonte(-10)">A−</button>
        <strong aria-live="polite">{{ porcentagem() }}%</strong>
        <button type="button" aria-label="Aumentar letra"
          [disabled]="porcentagem() >= maxima * 100" (click)="mudarFonte(10)">A+</button>
      </div>

      <p class="amostra">Este é um exemplo de texto.</p>
    </section>

    <section>
      <h3>Tema</h3>

      @for (tema of temas; track tema.valor) {
        <button
          type="button"
          class="tema {{ tema.valor }}"
          [class.selecionado]="preferencias.atual().tema === tema.valor"
          [attr.aria-pressed]="preferencias.atual().tema === tema.valor"
          (click)="preferencias.alterar({ tema: tema.valor })">
          <span>{{ tema.nome }}</span>
          <span class="marca" aria-hidden="true">✓</span>
        </button>
      }
    </section>

    @if (preferencias.aviso()) {
      <p class="aviso" role="alert">{{ preferencias.aviso() }}</p>
    }

  </aside>
}
